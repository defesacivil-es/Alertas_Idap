[project]
name = "alertas-idap"
version = "0.1.0"
description = "Monitoramento de alertas CAP do IDAP para o Espírito Santo"
authors = [
    { name = "felipebgoncalves", email = "felipeb.goncalves@hotmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib (>=3.10.9,<4.0.0)",
    "geopandas (>=1.1.3,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
